version: '3.8'

services:
  postgres-test:
    image: postgres:13
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=subscriptions_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - test-network

  unit-test-runner:
    build:
      context: .
      dockerfile: Dockerfile.test
    command: >
      sh -c "
        echo 'Running UNIT tests only...' &&
        go test -v -short ./internal/handlers ./internal/service 2>&1 | tee /app/test-reports/unit-tests.log
      "
    networks:
      - test-network

  integration-test-runner:
    build:
      context: .
      dockerfile: Dockerfile.test
    depends_on:
      postgres-test:
        condition: service_healthy
    environment:
      - DB_HOST=postgres-test
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=password
      - DB_NAME=subscriptions_test
      - DB_SSLMODE=disable
      - PGPASSWORD=password
    volumes:
      - ./test-reports:/app/test-reports
      - ./migrations:/app/migrations
    command: >
      sh -c "
        echo 'Starting integration tests setup...' &&
        echo 'Applying migrations...' &&
        until pg_isready -h postgres-test -p 5432 -U postgres; do echo 'Waiting for database...'; sleep 2; done &&
        PGPASSWORD=password psql -h postgres-test -p 5432 -U postgres -c 'CREATE DATABASE subscriptions_test;' 2>/dev/null || echo 'Database exists' &&
        PGPASSWORD=password psql -h postgres-test -p 5432 -U postgres -d subscriptions_test -f /app/migrations/001_init_subscriptions.sql &&
        echo 'Migrations applied!' &&
        echo 'Running INTEGRATION tests...' &&
        go test -v -tags=integration -timeout=30s ./internal/repository 2>&1 | tee /app/test-reports/integration-tests.log
      "
    networks:
      - test-network

networks:
  test-network:
    driver: bridge